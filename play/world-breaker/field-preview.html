<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172e30"><title>작은 원정대 · 채집과 사냥</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101f24;color:#ece8d8;font:15px/1.5 system-ui,sans-serif;padding:16px 12px calc(22px + env(safe-area-inset-bottom))}main{max-width:520px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:23px;margin:5px 0}small,.muted{color:#a5b9b7;font-size:13px}a{color:#c9ddcd;font-size:13px}.eyebrow{color:#d8b77d;letter-spacing:.13em;font-size:12px}.stock{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:16px 0 10px}.stock div{background:#20363b;border:1px solid #3c5150;border-radius:10px;padding:8px;text-align:center}.stock span{display:block;color:#b5c8bd;font-size:13px}.stock b{font-size:21px;font-variant-numeric:tabular-nums}canvas{display:block;width:100%;height:auto;border:1px solid #687653;border-radius:14px;background:#24483e;touch-action:manipulation;image-rendering:pixelated}button{min-height:46px;border:1px solid #64776c;border-radius:9px;background:#29464a;color:#f2edde;font:inherit;font-weight:650;padding:10px 12px;cursor:pointer}button:hover{background:#3b5b5b}button:focus-visible,a:focus-visible,canvas:focus-visible{outline:3px solid #f1d58e;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.primary{background:#c4a36b;color:#1d292b;border-color:#e8c98f}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide{grid-column:1/-1}.targets{display:grid;gap:7px;grid-template-columns:1fr}#status{min-height:44px;margin:0;padding:10px 2px;color:#c8dccc;font-size:14px}.note{padding:12px;background:#1b3035;border-radius:10px;margin-top:12px}.note b{color:#dfc38b}.note p{font-size:14px;margin:4px 0}.legend{display:flex;flex-wrap:wrap;gap:6px 15px;margin:10px 0;font-size:13px;color:#c8d5c6}.legend span:before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;background:var(--c)}dialog{background:#1c343a;color:#f5efdf;border:1px solid #c5a977;border-radius:16px;padding:22px;width:min(90vw,420px)}dialog::backdrop{background:#09151ac9}dialog h2{margin:4px 0;font-size:23px}dialog p{color:#c9d7cb}dialog .actions{margin-top:20px}[hidden]{display:none!important}@media(min-width:400px){.targets{grid-template-columns:1fr 1fr 1fr}.targets button{font-size:13px;padding:10px 5px}}</style></head>
<body><main><header><div><div class="eyebrow">FIELD STUDY · 01</div><h1>작은 원정대</h1><small>동료는 채집하고, 당신은 사냥을 선택하세요.</small></div><a href="../../">게임 목록</a></header>
<section class="stock" aria-label="이번 접속에서 모은 자원"><div><span>목재</span><b id="wood">0</b></div><div><span>광석</span><b id="ore">0</b></div><div><span>약초</span><b id="herb">0</b></div><div><span>정수</span><b id="essence">0</b></div></section>
<canvas id="scene" width="420" height="430" tabindex="0" aria-label="동료 세 명이 벌목·채광·약초 채집 후 야영지로 운반합니다. 몬스터 선택은 아래 버튼으로도 가능합니다."></canvas>
<p id="status" role="status"></p>
<section id="field-actions" aria-label="사냥 상대 선택"><div class="targets"><button id="monster-0">가시 멧돼지 확인</button><button id="monster-1">그늘 늑대 확인</button><button id="monster-2">이끼 수호자 확인</button></div><div class="legend"><span style="--c:#f2c179">벌목 담당</span><span style="--c:#8ccfee">채광 담당</span><span style="--c:#c3b0f4">약초 담당</span></div></section>
<section id="battle-actions" class="actions" aria-label="전투 조작" hidden><button id="attack" class="primary">공격</button><button id="dodge">회피</button><button id="back" class="wide">필드로 돌아가기</button></section>
<div class="note"><b>채집·사냥 동작 시제품</b><p>걷기 → 작업 → 짐 운반 → 자원 획득. 몬스터를 선택하고 확인하면 전투를 시작합니다.</p><p class="muted">본편 적용 전 별도 테스트입니다. 자원과 전투 결과는 이 화면에만 적용되며 새로고침하면 초기화됩니다. 화면을 떠나면 진행이 멈춥니다.</p></div>
</main><dialog id="encounter" aria-labelledby="enemy-name" aria-describedby="enemy-info encounter-note"><div class="eyebrow">ENCOUNTER</div><h2 id="enemy-name"></h2><p id="enemy-info"></p><p id="encounter-note">선발대가 출전합니다. 공격 예고를 보고 회피하세요. 전투 중 채집은 잠시 쉽니다.</p><div class="actions"><button id="cancel" autofocus>채집 계속</button><button id="start" class="primary">전투 시작</button></div></dialog>
<script type="module" src="./src/field-scene-preview.js?v=1"></script></body></html>
